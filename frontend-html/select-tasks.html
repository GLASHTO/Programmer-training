<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Выбор задач для соревнования</title>
    <link rel="stylesheet" href="./src/css/menu.css">
    <style>
        .task-selector { background: #0a0a0a; padding: 20px; border: 1px solid #333; max-height: 400px; overflow-y: auto; margin: 20px 0; box-shadow: 0 0 15px rgba(0, 243, 255, 0.05); }
        .task-row { display: flex; align-items: center; gap: 15px; padding: 12px; border-bottom: 1px solid #1a1a1a; }
        .task-row:hover { background: #111; }
        .task-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .task-row label { cursor: pointer; font-size: 1.1rem; color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="menu-container">
        <header class="menu-header">
            <h1 class="sys-title">ВЫБОР ЗАДАЧ</h1>
        </header>
        
        <div id="taskList" class="task-selector">Загрузка списка задач системы...</div>
        
        <nav class="main-nav">
            <button class="nav-btn" id="btnFinalCreate">[ ЗАПУСТИТЬ СОРЕВНОВАНИЕ ]</button>
            <button class="nav-btn logout" onclick="window.location.href='/rooms.html'">[ ОТМЕНА ]</button>
        </nav>
    </div>

    <script type="module" src="./src/scripts/select-tasks.js"></script>
</body>
</html>
